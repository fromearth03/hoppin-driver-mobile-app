org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Google Maps key is deliberately NOT set here. This file is tracked in
# git, so a key written into it would be committed. Pass it on the build
# instead, where it stays out of the repository:
#
#   flutter build apk --release -PMAPS_API_KEY=AIza...
#
# A key restricted to this app's package name and SHA-1 fingerprint is only
# usable by builds signed with that certificate. Add BOTH the debug and the
# release fingerprint, or the map goes blank in release only.
